apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-v1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transaction-service
      version: v1
  template:
    metadata:
      labels:
        app: transaction-service
        version: v1
    spec:
      containers:
        - name: transaction-service
          image: skillfybank-transaction:v1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
