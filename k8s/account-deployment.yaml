
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: skillfybank-account:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 3000

          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: account-config
                  key: APP_NAME

            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: account-config
                  key: APP_ENV

            - name: DEMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: account-secret
                  key: DEMO_API_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20

          volumeMounts:
            - name: account-storage
              mountPath: /app/data

      volumes:
        - name: account-storage
          persistentVolumeClaim:
            claimName: account-pvc
