apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: notification-destination
  namespace: default
spec:
  host: notification-service.default.svc.cluster.local
  subsets:
    - name: v1
      labels:
        app: notification-service
        version: latest
    - name: v2
      labels:
        app: notification-service
        version: v2
