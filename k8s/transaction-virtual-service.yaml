apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: transaction-routing
  namespace: default
spec:
  hosts:
    - transaction-service
  http:
    - route:
        - destination:
            host: transaction-service
            subset: v1
          weight: 90
        - destination:
            host: transaction-service
            subset: v2
          weight: 10
